# Neuro-GRAPE Member 3 GroupDRO & Regime Evaluation Configuration
# =================================================================

project:
  name: "Neuro-GRAPE"
  component: "Member 3 — GroupDRO & Evaluation Pipeline"
  phase: 5
  description: "Distributionally robust optimization, unsupervised regime clustering, and worst-group generalization evaluation"

paths:
  embeddings_pt: "embeddings/embeddings.pt"
  metadata_csv: "embeddings/metadata.csv"
  output_dir: "reports/artifacts"
  checkpoint_path: "checkpoints/baseline.pt"
  data_inventory: "data_inventory.csv"

# Grouping strategy options:
# - "cluster" : Unsupervised KMeans clustering fitted strictly on training embeddings
# - "modality": Explicit modal partitions (eeg, meg, fmri)
# - "metadata": Predefined metadata groupings (e.g., category_name or category_id)
grouping:
  strategy: "cluster"
  metadata_column: "category_name"

clustering:
  n_clusters: 2
  random_state: 42
  expected_dim: null  # null enables automatic dimension detection from embeddings
  fit_split: "train"
  disclaimer: "Exploratory mathematical clusters across shared embeddings, not proven biological regimes."

group_dro:
  learning_rate: 0.05
  update_frequency: 1
  min_group_size: 1
  smoothing: 0.01
  min_weight: 0.0
  num_steps: 10

evaluation:
  temperature: 0.07
  min_group_size: 1
  metrics:
    - name: "crossmodal_contrastive_loss"
      higher_is_better: false
    - name: "crossmodal_cosine_similarity"
      higher_is_better: true
